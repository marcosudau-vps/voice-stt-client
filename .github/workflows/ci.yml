name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  test-and-build:
    name: Test and build release candidates
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Enable Windows long paths
        run: git config --system core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          # 3.12.10 is the qualified Windows V1 build runtime. A patch-level
          # change requires a fresh frozen Qt GUI smoke before this is raised.
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile all Python modules
        run: python -m compileall -q voice_stt_client scripts tests

      - name: Build and smoke-test executable
        run: python scripts/build.py --clean

      - name: Build and validate Python distributions
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Smoke-test installed wheel namespace and resources
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "wheel-smoke"
          python -m pip install --no-deps --target $target (Get-Item dist/*.whl).FullName
          Push-Location $env:RUNNER_TEMP
          try {
            $env:PYTHONPATH = $target
            python -c "import importlib.util, voice_stt_client; from voice_stt_client.core.config import DEFAULT_CONFIG_PATH; from voice_stt_client.ui.feedback import application_resource_root; assert importlib.util.find_spec('core') is None; assert importlib.util.find_spec('ui') is None; assert DEFAULT_CONFIG_PATH.is_file(); assert (application_resource_root() / 'assets' / 'feedback_sounds' / 'debug' / 'start.wav').is_file(); print(voice_stt_client.__version__)"
            python -m voice_stt_client --version
          } finally {
            Pop-Location
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: voice-stt-client-v${{ steps.version.outputs.version }}-release-candidates
          path: |
            dist/voice-stt-client.exe
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
