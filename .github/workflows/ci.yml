name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  test-and-build:
    name: Test and build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run complete test suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile all Python modules
        run: python -m compileall -q app.py core ui scripts tests

      - name: Build and smoke-test executable
        run: python scripts/build.py --clean

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: voice-stt-client-v${{ steps.version.outputs.version }}-windows-x64
          path: dist/voice-stt-client.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
