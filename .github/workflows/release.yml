name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful main CI run that built the qualified EXE, wheel and sdist'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify CI candidate and freeze exact release bundle
    if: github.repository == 'marcosudau-vps/voice-stt-client'
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: read}
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - id: identity
        name: Verify CI run provenance and exact source version
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(tr -d '\r\n' < VERSION)" = 1.0.0
          run_id='${{ inputs.candidate_run_id }}'
          [[ "$run_id" =~ ^[0-9]+$ ]]
          source="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .path)"
          branch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_branch)"
          test "$conclusion" = success
          test "$branch" = main
          test "$workflow" = '.github/workflows/ci.yml'
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$source" HEAD
          echo "source_commit=$source" >> "$GITHUB_OUTPUT"
          git fetch origin --tags
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            test "$(git rev-list -n1 v1.0.0)" = "$source" || { echo 'CONFLICT: existing tag'; exit 1; }
          fi
      - uses: actions/download-artifact@v8
        with:
          name: voice-stt-client-v1.0.0-release-candidates
          path: candidate
          run-id: '${{ inputs.candidate_run_id }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Prepare bundle from CI bytes without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          python scripts/client_release_guard.py candidate --dir candidate
          mkdir -p release/windows release/python
          find candidate -name 'voice-stt-client.exe' -exec cp '{}' release/windows/voice-stt-client-v1.0.0-windows-x64.exe \;
          find candidate -name '*.whl' -exec cp '{}' release/python/ \;
          find candidate -name '*.tar.gz' -exec cp '{}' release/python/ \;
          python - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('release')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          assert len(files)==3
          (root/'SHA256SUMS.txt').write_text(''.join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n"
              for p in files), encoding='ascii')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: voice-stt-client-v1.0.0-release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-pypi:
    name: Publish and verify exact CI wheel and sdist on PyPI
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/voice-stt-client
    permissions: {actions: read, contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: voice-stt-client-v1.0.0-release-bundle, path: release}
      - id: stage
        name: Classify PyPI files and stage only absent ones
        run: python scripts/client_release_guard.py stage --dir release --stage-dir staged
      - name: Publish only missing files with Trusted Publishing
        if: steps.stage.outputs.has_missing == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with: {packages-dir: staged/}
      - name: Verify both remote PyPI hashes before any Git tag
        run: python scripts/client_release_guard.py verify --dir release

  tag:
    name: Create exact Git tag only after PyPI verification
    needs: [preflight, publish-pypi]
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ needs.preflight.outputs.source_commit }}', fetch-depth: 0}
      - name: Create or verify v1.0.0 at qualified CI commit
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ needs.preflight.outputs.source_commit }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(tr -d '\r\n' < VERSION)" = 1.0.0
          git fetch origin --tags --force
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            test "$(git rev-list -n1 v1.0.0)" = "$expected" || { echo 'CONFLICT: tag points elsewhere'; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.0.0 "$expected" -m 'VoiceSTT Client 1.0.0'
            git push origin refs/tags/v1.0.0
          fi

  github-release:
    name: Publish GitHub Release last from the same CI bundle
    needs: [preflight, tag]
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ needs.preflight.outputs.source_commit }}', fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with: {name: voice-stt-client-v1.0.0-release-bundle, path: release}
      - name: Create/resume and verify GitHub release assets
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ needs.preflight.outputs.source_commit }}'
          git fetch origin --tags
          test "$(git rev-list -n1 v1.0.0)" = "$expected"
          python scripts/client_release_guard.py verify --dir release
          (cd release && sha256sum -c SHA256SUMS.txt)
          assets=(release/windows/voice-stt-client-v1.0.0-windows-x64.exe release/python/*.whl release/python/*.tar.gz release/SHA256SUMS.txt)
          test "${#assets[@]}" -eq 4
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          if gh release view v1.0.0 --json tagName >/dev/null 2>&1; then
            existing="$(gh release view v1.0.0 --json assets --jq '.assets[].name')"
            for f in "${assets[@]}"; do
              name="$(basename "$f")"
              if grep -Fxq "$name" <<< "$existing"; then
                gh release download v1.0.0 --pattern "$name" --dir "$verify_dir"
                cmp -s "$f" "$verify_dir/$name" || { echo "CONFLICT: $name"; exit 1; }
              else
                gh release upload v1.0.0 "$f"
              fi
            done
          else
            gh release create v1.0.0 "${assets[@]}" --verify-tag --title 'VoiceSTT Client 1.0.0' --notes 'Companion to VoiceSTT Server 1.0.0. Windows desktop executable plus Python wheel and source distribution.'
          fi
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            if [ ! -f "$verify_dir/$name" ]; then gh release download v1.0.0 --pattern "$name" --dir "$verify_dir"; fi
            cmp -s "$f" "$verify_dir/$name" || { echo "CONFLICT: $name"; exit 1; }
          done
