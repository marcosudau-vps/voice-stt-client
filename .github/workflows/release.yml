name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  release:
    name: Verify and publish Windows release
    if: github.repository == 'marcosudau-vps/voice-stt-client'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify tag and VERSION
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }

      - name: Run complete test suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile all Python modules
        run: python -m compileall -q app.py core ui scripts tests

      - name: Build and smoke-test executable
        run: python scripts/build.py --clean

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          New-Item -ItemType Directory -Force release | Out-Null
          $asset = "release/voice-stt-client-v$version-windows-x64.exe"
          Copy-Item -LiteralPath dist/voice-stt-client.exe -Destination $asset
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $asset)" | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title $env:GITHUB_REF_NAME `
            --generate-notes `
            release/voice-stt-client-*.exe `
            release/SHA256SUMS.txt
